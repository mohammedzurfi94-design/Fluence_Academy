<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fluence Academy Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <!-- Header Banner -->
        <div class="bg-slate-900 p-8 text-center text-white relative">
            <div class="w-14 h-14 rounded-xl bg-indigo-600 mx-auto flex items-center justify-center text-xl font-bold mb-3 shadow-lg shadow-indigo-600/30">
                FA
            </div>
            <h1 class="text-xl font-bold tracking-tight">Fluence Academy</h1>
            <p class="text-xs text-slate-400 mt-1">Admin & Teacher Secure Access Portal</p>
        </div>

        <!-- Form Section -->
        <div class="p-8">
            {% if error %}
            <div class="mb-5 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center gap-3">
                <i class="fa-solid fa-triangle-exclamation text-rose-500"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                            <i class="fa-regular fa-user"></i>
                        </span>
                        <input type="text" name="username" required autofocus placeholder="admin"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 text-sm transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" required placeholder="••••••••••••"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 text-sm transition">
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl transition shadow-md shadow-indigo-600/20 flex items-center justify-center gap-2">
                    <span>Sign In to Dashboard</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-100 text-center">
                <p class="text-xs text-gray-500">
                    Default credentials: <code class="text-indigo-600 font-mono bg-indigo-50 px-1.5 py-0.5 rounded">admin</code> / <code class="text-indigo-600 font-mono bg-indigo-50 px-1.5 py-0.5 rounded">adminpassword123</code>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
